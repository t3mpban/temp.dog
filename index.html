<!doctype html>
<html lang="en">
  <head>
    <meta name="title" content="t3mp's website" />
    <meta
      name="description"
      content="My personal website disguised as a 3D point-and-click visual novel, with achievements, lore and secrets..."
    />
    <meta
      name="keywords"
      content="t3mp, t3mpban, t3mpyt, 3vu, t3vu, temp, tempban, tempyt, temp youtube, t3wp, t3mp twitter, t3mp youtube, t3mp twitch, t3mps website, t3mp's website, temp's website, t3mp's Website"
    />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="language"
      content="English, Spanish, Portuguese, French, German, Japanese, Korean, Chinese"
    />
    <meta name="author" content="t3mp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta content="https://www.temp.dog/" property="og:url" />
    <meta content="https://temp.dog/images/banner.webp" property="og:image" />
    <meta content="#fed8b1" data-react-helmet="true" name="theme-color" />

    <!-- Discord embed tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="temp.dog" />
    <meta property="og:title" content="t3mp's website" />
    <meta
      property="og:description"
      content="My personal website disguised as a 3D point-and-click visual novel, with achievements, lore and secrets..."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta charset="utf-8" />
    <title>t3mp's website</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" type="text/css" href="scripts/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="f8a25eb1-84d1-48ab-b56d-03a37097f3af"
    ></script>
  </head>
  <body>
    <!-- content surface: a background rect revealed once loading finishes.
		     sits below the foreground UI and isn't one of the parallax-nudged layers.
		     the webgl game renders into the canvas it clips -->
    <div class="screen" id="screen" aria-hidden="true">
      <canvas class="game" id="game"></canvas>
    </div>

    <!-- visual-novel textbox: hidden + inert until textbox("ref") is called from js.
		     mid-ground layer (parallax-nudged), pops in/out by scaling from 0 -->
    <div class="textbox" id="textbox" aria-hidden="true" inert>
      <p class="textbox-text" id="textboxText"></p>
      <span class="textbox-next" id="textboxNext" aria-hidden="true">
        <i class="fa-solid fa-caret-down" aria-hidden="true"></i>
      </span>
    </div>

    <!-- achievement toast: slides down from the top (xbox-360 style) when
		     achievement("id") is called. status region so it's announced -->
    <div class="ach" id="ach" role="status" aria-live="polite">
      <span class="ach-icon" id="achIcon"><i class="fa-solid" aria-hidden="true"></i></span>
      <span class="ach-body">
        <span class="ach-title" id="achTitle"></span>
        <span class="ach-desc" id="achDesc"></span>
        <span class="ach-bar" id="achBar" hidden>
          <span class="ach-bar-track"><span class="ach-bar-fill" id="achBarFill"></span></span>
          <span class="ach-bar-num" id="achBarNum"></span>
        </span>
      </span>
    </div>

    <!-- center stage: the loading bar -->
    <main class="stage">
      <div class="loader-wrap" id="loaderWrap">
        <div
          class="loader cursorable"
          id="loader"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="track"><div class="fill dark" id="fill"></div></div>
        </div>
      </div>
    </main>

    <button class="zone-back" id="zoneBack" aria-label="back">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    </button>

    <!-- top-right settings: square container morphs to reveal options -->
    <aside class="settings" id="settings">
      <button
        class="gear cursorable"
        id="gear"
        data-i18n-aria="settings-title"
        aria-label="Settings"
        aria-expanded="false"
      >
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </button>

      <div class="panel">
        <div class="panel-head" data-i18n="settings-title">settings</div>
        <div class="divider"></div>
        <div class="opts">
          <div class="grp">
            <label class="opt opt--range" data-setting="music">
              <span class="opt-label" data-i18n="label-music">music</span>
              <input
                class="range cursorable"
                type="range"
                min="0"
                max="10"
                step="1"
                value="0"
                aria-label="music volume"
              />
              <span class="opt-val">0</span>
            </label>
            <label class="opt opt--range" data-setting="sounds">
              <span class="opt-label" data-i18n="label-sounds">sound</span>
              <input
                class="range cursorable"
                type="range"
                min="0"
                max="10"
                step="1"
                value="0"
                aria-label="sounds volume"
              />
              <span class="opt-val">0</span>
            </label>
          </div>

          <div class="grp">
            <button
              class="opt opt--toggle cursorable"
              data-setting="fullscreen"
              aria-pressed="false"
            >
              <span class="opt-label" data-i18n="label-fullscreen">fullscreen</span>
              <span class="opt-state">off</span>
            </button>
            <div class="opt opt--select" data-setting="language">
              <span class="opt-label" data-i18n="label-language">language</span>
              <span class="sel-wrap">
                <button
                  type="button"
                  class="select cursorable"
                  id="langBtn"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  aria-label="language"
                >
                  <span id="langBtnLabel">english</span>
                </button>
                <span class="caret" aria-hidden="true">&#9662;</span>
              </span>
            </div>
            <button class="opt opt--action cursorable" data-setting="achievements">
              <span class="opt-label" data-i18n="label-achievements">achievements</span>
              <span class="opt-glyph">
                <i class="fa-solid fa-trophy" aria-hidden="true"></i>
              </span>
            </button>
          </div>

          <div class="grp">
            <button class="opt opt--action cursorable" data-setting="cache">
              <span class="opt-label" data-i18n="label-cache">clear cache</span>
              <span class="opt-glyph">
                <i class="fa-solid fa-trash" aria-hidden="true"></i>
              </span>
            </button>
            <!-- legacy: previous completed version of the site -->
            <a class="opt opt--action cursorable" data-setting="legacy" href="/v4">
              <span class="opt-label" data-i18n="label-legacy">legacy website</span>
              <span class="opt-glyph"
                ><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i
              ></span>
            </a>
          </div>
        </div>
      </div>
    </aside>

    <div class="dim" id="dim" hidden></div>
    <div
      class="achv"
      id="achv"
      role="dialog"
      aria-modal="true"
      aria-labelledby="achvTitle"
      hidden
      inert
    >
      <div class="achv-head">
        <span class="achv-title" id="achvTitle" data-i18n="label-achievements">achievements</span>
        <span class="achv-count" id="achvCount"></span>
        <button
          class="achv-close cursorable"
          id="achvClose"
          data-i18n-aria="label-close"
          aria-label="close"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="divider"></div>
      <div class="achv-list" id="achvList"></div>
    </div>

    <div class="choices" id="choices" hidden inert></div>

    <div class="notice" id="notice" role="status" aria-live="polite"></div>

    <!-- corner signature -->
    <footer class="sig" data-i18n="small-text">made by t3mp</footer>

    <!-- custom weighted cursor + helpers (decorative, no-op without JS / on touch) -->
    <div class="cursor" id="cursor" aria-hidden="true"><div class="cursor-dot"></div></div>
    <div class="cursor-tip" id="tip" aria-hidden="true"><span class="bubble">0%</span></div>

    <script type="module" src="scripts/script.js"></script>
    <script type="module" src="scripts/game.js"></script>
  </body>
</html>
