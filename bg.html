<!doctype html>
<html>
  <head>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://temp.dog/" />
    <style>
      :root {
        --coffee-bean: #6f4e37;
        --camel: #c19a6b;
        --soft-apricot: #fed8b1;
        --papaya-whip: #ffefd5;
        --tan: #e0b98e;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        background: var(--soft-apricot);
        font-family: "temp-v2", "Trebuchet MS", system-ui, sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--tan);

        -webkit-mask-image: url("/images/bg.webp");
        -webkit-mask-size: 256px 256px;
        -webkit-mask-repeat: repeat;

        mask-image: url("/images/bg.webp");
        mask-size: 256px 256px;
        mask-repeat: repeat;

        animation: bg-scroll 14s linear infinite;
        pointer-events: none;
      }

      @keyframes bg-scroll {
        from {
          -webkit-mask-position: 0 0;
          mask-position: 0 0;
        }
        to {
          -webkit-mask-position: 256px -256px;
          mask-position: 256px -256px;
        }
      }

      @font-face {
        font-family: "temp-v2";
        src: url("../font/t3mp.ttf") format("truetype");
        font-display: swap;
      }
    </style>
  </head>

  <body></body>
</html>
